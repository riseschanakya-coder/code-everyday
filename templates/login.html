<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeDaily</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
    <section class="auth-card">
        <div class="auth-header">
            <span class="brand-mark">CD</span>
            <h1>Welcome back</h1>
            <p>Log in to continue your daily coding streak.</p>
        </div>
        <form method="POST" class="auth-form">
            <label>Email</label>
            <input type="email" name="email" autocomplete="email" required>
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
            <button type="submit">Login</button>
        </form>
        {% if message %}<p class="form-message">{{ message }}</p>{% endif %}
        <p class="auth-switch">New to CodeDaily? <a href="{{ url_for('register') }}">Create an account</a></p>
    </section>
</body>
</html>
