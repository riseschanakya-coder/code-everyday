<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CodeDaily</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
    <section class="auth-card">
        <div class="auth-header">
            <span class="brand-mark">CD</span>
            <h1>Create account</h1>
            <p>Start solving one focused coding question every day.</p>
        </div>
        <form method="POST" class="auth-form">
            <label>Full name</label>
            <input type="text" name="fullname" autocomplete="name" required>
            <label>Email</label>
            <input type="email" name="email" autocomplete="email" required>
            <label>Password</label>
            <input type="password" name="password" autocomplete="new-password" minlength="6" required>
            <button type="submit">Register</button>
        </form>
        {% if message %}<p class="form-message">{{ message }}</p>{% endif %}
        <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </section>
</body>
</html>
